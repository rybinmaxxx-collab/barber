name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/site-deployment-8dcky9
      - claude/new-session-0qeeoo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # Сайт репозитория живёт по адресу <owner>.github.io/<repo>/,
        # поэтому сборке нужен подпуть. На Vercel и на своём домене
        # переменная не задаётся, и сайт собирается от корня.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - run: touch out/.nojekyll
      # Требует, чтобы Pages были включены в репозитории:
      # Settings → Pages → Source: GitHub Actions.
      # Включить их из workflow нельзя — у токена Actions нет прав
      # администратора репозитория.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
